[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture_assistant"
version = "0.1.0"
description = "Desktopowa aplikacja Windows do analizy widocznych cech dłoni z kamery."
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "opencv-python",
    "mediapipe",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.gesture_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
